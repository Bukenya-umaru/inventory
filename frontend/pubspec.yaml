name: inventory_app
description: "Multi-Tenant Inventory Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  web: ^1.1.1
  pdf: ^3.11.2
  audioplayers: ^6.1.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/
    - assets/sounds/
